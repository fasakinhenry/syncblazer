<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#287BFF" />
    <meta name="description" content="Your devices, one workspace. SyncBlaze moves files, notes, and links between your phone and laptop instantly, plus private end-to-end encrypted chat for your rooms." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SyncBlaze" />

    <!-- Static Open Graph / Twitter Card preview: deliberately not
         per-page dynamic (that would need a server-rendering step or an
         Edge Function, which costs money to run on every share/crawl).
         One good branded image for every shared link is the zero-cost
         tradeoff. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SyncBlaze" />
    <meta property="og:title" content="SyncBlaze: Your devices, one workspace." />
    <meta property="og:description" content="Move files, notes, and links between your devices instantly, with private end-to-end encrypted room chat." />
    <meta property="og:url" content="https://syncblazer.vercel.app/" />
    <meta property="og:image" content="https://syncblazer.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SyncBlaze: Your devices, one workspace." />
    <meta name="twitter:description" content="Move files, notes, and links between your devices instantly, with private end-to-end encrypted room chat." />
    <meta name="twitter:image" content="https://syncblazer.vercel.app/og-image.png" />

    <title>SyncBlaze</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
